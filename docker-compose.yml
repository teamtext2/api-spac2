version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: text2os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_pass}
      POSTGRES_DB: ${POSTGRES_DB:-text2chat}
    volumes:
      - /home/text2/data/postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-text2chat}"]
      interval: 5s
      timeout: 5s
      retries: 5

  text2os-api-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: text2os-api-1
    restart: unless-stopped
    ports:
      - "7860:7860"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Persist local avatar data if R2 not configured
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
